<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتب يحيى للإلكترونيات</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
height:100vh;
overflow:hidden;
background:
linear-gradient(rgba(0,8,20,.85),rgba(0,0,0,.9)),
url("gaming-bg.jpg") center/cover;
color:#fff;
font-family:Segoe UI,Tahoma,sans-serif;
}

#brand{
height:90px;
display:flex;
align-items:center;
justify-content:center;
gap:20px;
background:rgba(0,0,0,.55);
border-bottom:1px solid #00e5ff;
box-shadow:0 0 30px #00aaff55;
}

#brand img{
width:60px;
height:60px;
border-radius:50%;
border:2px solid #00e5ff;
box-shadow:0 0 25px #00e5ff;
}

#brand b{
font-size:28px;
color:#00e5ff;
text-shadow:0 0 15px #008cff;
}

#wrap{
padding:25px;
height:calc(100vh - 170px);
}

#state{
font-size:30px;
font-weight:bold;
color:#22ff88;
text-shadow:0 0 20px #22ff88;
}

#out{
height:85%;
background:rgba(0,0,0,.65);
border:1px solid #008cff;
border-radius:20px;
padding:20px;
font-family:Consolas,monospace;
box-shadow:0 0 50px #008cff55,inset 0 0 30px #000;
overflow:auto;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
display:flex;
justify-content:center;
gap:50px;
align-items:center;
background:#020617cc;
border-top:1px solid #008cff;
color:#00e5ff;
font-size:22px;
}
</style>
</head>

<body>

<div id="brand">
<img src="logo_raw.png">
<b>مكتب يحيى للإلكترونيات 📞 077X XXX XXXX</b>
</div>

<div id="wrap">
<div id="state">POOPS TERMINAL</div>
<div id="out"></div>
</div>

<div class="bottom">
🎮 ألعاب
🛠 صيانة
💻 خدمات
</div>

<script type="module">
import "./chain_poops.js";
</script>

</body>
</html>
